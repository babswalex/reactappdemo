name: Deploy Reliance Todo

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - staging
          - production
        default: 'dev'
      deploy_to_dev:
        description: 'Deploy to dev environment'
        required: false
        type: boolean
        default: true
      deploy_to_staging:
        description: 'Deploy to staging environment'
        required: false
        type: boolean
        default: false
      deploy_to_production:
        description: 'Deploy to production environment'
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd Frontend
          npm install

      - name: Build app
        run: |
          cd Frontend
          npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: Frontend/dist   # ✅ FIXED

  deploy-dev:
    name: Deploy to Dev
    needs: build
    if: ${{ github.event.inputs.deploy_to_dev == 'true' }}
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: app-build
          path: ./deploy

      - name: Deploy to Azure Static Web App (Dev)
        uses: azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "upload"
          app_location: "./deploy"
          output_location: "."   # ✅ IMPORTANT (already built)

  deploy-staging:
    name: Deploy to Staging
    needs: build
    if: ${{ github.event.inputs.deploy_to_staging == 'true' }}
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: app-build
          path: ./deploy

      - name: Deploy to Azure Static Web App (Staging)
        uses: azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "upload"
          app_location: "./deploy"
          output_location: "."   # ✅ IMPORTANT

  deploy-production:
    name: Deploy to Production
    needs: build
    if: ${{ github.event.inputs.deploy_to_production == 'true' }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: app-build
          path: ./deploy

      - name: Deploy to Azure Static Web App (Production)
        uses: azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "upload"
          app_location: "./deploy"
          output_location: "."   # ✅ IMPORTANT
